<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Handle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <button class="tab active" data-target="nonFollowersCard">
          👥 Non-Followers Checker
        </button>

        <button class="tab" data-target="requestsCard">📤 Requests Sent</button>
      </div>

      <!-- Card 1 -->
      <div id="nonFollowersCard" class="card active">
        <div class="upload-group">
          <label>Followers JSON</label>
          <input type="file" id="followersFile" accept=".json" />
        </div>

        <div class="upload-group">
          <label>Following JSON</label>
          <input type="file" id="followingFile" accept=".json" />
        </div>

        <button id="checkBtn">Find Non-Followers</button>

        <div class="results">
          <h3 class="count" id="not-following-back-count"></h3>
          <ul id="not-following-back" class="results-list"></ul>
        </div>
      </div>

      <!-- Card 2 -->
      <div id="requestsCard" class="card">
        <div class="upload-group">
          <label>Requests JSON</label>
          <input type="file" id="requestsFile" accept=".json" />
        </div>

        <button id="requestsBtn">Show Requests</button>

        <div class="results">
          <h3 class="count" id="requests-count"></h3>
          <ul id="pending-requests" class="results-list"></ul>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
    <!-- <script src="v2.js"></script> -->
    <!-- <script src="old_script.js"></script> -->
  </body>
</html>
